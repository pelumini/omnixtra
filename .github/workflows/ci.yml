name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnixtra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnixtra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://omnixtra_migrations:omnixtra_migrations_password@localhost:5432/omnixtra
      OMNIXTRA_TEST_DATABASE_URL: postgresql://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare PostgreSQL roles and pgvector
        run: |
          PGPASSWORD=postgres_password psql -h localhost -U postgres -d omnixtra -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omnixtra_app LOGIN PASSWORD 'omnixtra_app_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_migrations LOGIN PASSWORD 'omnixtra_migrations_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_superadmin LOGIN PASSWORD 'omnixtra_superadmin_password' BYPASSRLS;
          CREATE EXTENSION IF NOT EXISTS vector;
          GRANT CONNECT ON DATABASE omnixtra TO omnixtra_app, omnixtra_migrations, omnixtra_superadmin;
          GRANT CREATE, USAGE ON SCHEMA public TO omnixtra_migrations;
          GRANT USAGE ON SCHEMA public TO omnixtra_app, omnixtra_superadmin;
          SQL
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app --strict
      - run: uv run python -m scripts.check_rls_migrations
      - name: Migration smoke
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests use real database
        run: |
          set -o pipefail
          uv run pytest tests/integration -m integration -rs | tee integration.log
          ! grep -q "OMNIXTRA_TEST_DATABASE_URL is not set" integration.log
      - run: uv run python -m scripts.check_isolation_coverage
      - run: uv run pytest -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run e2e
