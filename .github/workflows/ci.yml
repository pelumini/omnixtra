name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      cross_cutting: ${{ steps.filter.outputs.cross_cutting }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "${files}"

          api=false
          web=false
          cross_cutting=false

          if echo "${files}" | grep -Eq '^(api/|docker-compose\.yml|\.env\.example)'; then
            api=true
          fi
          if echo "${files}" | grep -Eq '^(web/)'; then
            web=true
          fi
          if echo "${files}" | grep -Eq '^(\.github/workflows/|AGENTS\.md|README\.md|docs/runbooks/)'; then
            cross_cutting=true
          fi

          echo "api=${api}" >> "${GITHUB_OUTPUT}"
          echo "web=${web}" >> "${GITHUB_OUTPUT}"
          echo "cross_cutting=${cross_cutting}" >> "${GITHUB_OUTPUT}"

  backend:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.cross_cutting == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnixtra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnixtra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://omnixtra_migrations:omnixtra_migrations_password@localhost:5432/omnixtra
      OMNIXTRA_TEST_DATABASE_URL: postgresql://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --dev
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare PostgreSQL roles and pgvector
        run: |
          PGPASSWORD=postgres_password psql -h localhost -U postgres -d omnixtra -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omnixtra_app LOGIN PASSWORD 'omnixtra_app_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_migrations LOGIN PASSWORD 'omnixtra_migrations_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_superadmin LOGIN PASSWORD 'omnixtra_superadmin_password' BYPASSRLS;
          CREATE EXTENSION IF NOT EXISTS vector;
          GRANT CONNECT ON DATABASE omnixtra TO omnixtra_app, omnixtra_migrations, omnixtra_superadmin;
          GRANT CREATE, USAGE ON SCHEMA public TO omnixtra_migrations;
          GRANT USAGE ON SCHEMA public TO omnixtra_app, omnixtra_superadmin;
          SQL
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app --strict
      - run: uv run python -m scripts.check_rls_migrations
      - name: Migration smoke
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests use real database
        run: |
          set -o pipefail
          uv run pytest tests/integration -m integration -rs | tee integration.log
          ! grep -q "OMNIXTRA_TEST_DATABASE_URL is not set" integration.log
      - run: uv run python -m scripts.check_isolation_coverage
      - run: uv run pytest -m "not integration"

  frontend:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.cross_cutting == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  isolation-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: omnixtra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omnixtra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://omnixtra_migrations:omnixtra_migrations_password@localhost:5432/omnixtra
      OMNIXTRA_TEST_DATABASE_URL: postgresql://omnixtra_app:omnixtra_app_password@localhost:5432/omnixtra
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --dev
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare PostgreSQL roles and pgvector
        run: |
          PGPASSWORD=postgres_password psql -h localhost -U postgres -d omnixtra -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE omnixtra_app LOGIN PASSWORD 'omnixtra_app_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_migrations LOGIN PASSWORD 'omnixtra_migrations_password' NOBYPASSRLS;
          CREATE ROLE omnixtra_superadmin LOGIN PASSWORD 'omnixtra_superadmin_password' BYPASSRLS;
          CREATE EXTENSION IF NOT EXISTS vector;
          GRANT CONNECT ON DATABASE omnixtra TO omnixtra_app, omnixtra_migrations, omnixtra_superadmin;
          GRANT CREATE, USAGE ON SCHEMA public TO omnixtra_migrations;
          GRANT USAGE ON SCHEMA public TO omnixtra_app, omnixtra_superadmin;
          SQL
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.check_isolation_coverage
      - name: Tenant isolation integration tests always run
        run: |
          set -o pipefail
          uv run pytest tests/integration -m integration -rs | tee integration.log
          ! grep -q "OMNIXTRA_TEST_DATABASE_URL is not set" integration.log

  browser-permission-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Header and permission specs always run
        run: npm run e2e -- e2e/my-courses-routing.spec.ts e2e/permission-contract.spec.ts
