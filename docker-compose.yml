services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnixtra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      OMNIXTRA_APP_PASSWORD: omnixtra_app_password
      OMNIXTRA_MIGRATIONS_PASSWORD: omnixtra_migrations_password
      OMNIXTRA_SUPERADMIN_PASSWORD: omnixtra_superadmin_password
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnixtra_app -d omnixtra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./api
    env_file:
      - .env.example
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
    command: [".venv/bin/alembic", "upgrade", "head"]
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./api
    command: [".venv/bin/dramatiq", "app.workers.main"]
    env_file:
      - .env.example
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
