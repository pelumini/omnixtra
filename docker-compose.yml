services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: omnixtra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      OMNIXTRA_APP_PASSWORD: omnixtra_app_password
      OMNIXTRA_MIGRATIONS_PASSWORD: omnixtra_migrations_password
      OMNIXTRA_SUPERADMIN_PASSWORD: omnixtra_superadmin_password
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnixtra_app -d omnixtra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    image: bitnamilegacy/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  minio-init:
    image: bitnamilegacy/minio:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/omnixtra-media"]
    depends_on:
      minio:
        condition: service_healthy

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$connection = @fsockopen('127.0.0.1', 8080); if ($$connection) { fclose($$connection); exit(0); } exit(1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    env_file:
      - .env.example
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_APP_BASE_DOMAIN: localhost
    ports:
      - "3001:3001"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/auth').then((response) => response.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./api
    command: [".venv/bin/alembic", "upgrade", "head"]
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./api
    command: [".venv/bin/dramatiq", "app.workers.main"]
    env_file:
      - .env.example
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  web-node-modules:
  web-next-cache:
  minio-data:
