[project]
name = "omnixtra-api"
version = "0.1.0"
description = "FastAPI backend for OmniXtra"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "dramatiq[redis]>=2.2.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.12",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.10.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sentry-sdk[fastapi]>=2.33.0",
    "sqlalchemy>=2.0.51",
    "structlog>=25.4.0",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pytest-tmp", ".tmp"]

[tool.uv]
package = false

[tool.omnixtra.scripts]
verify = "uv run python -m scripts.verify"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require external services such as PostgreSQL",
]
